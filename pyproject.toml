[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "fin-copilot"
version = "0.1.0"
description = "Finance forecasting copilot: revenue forecasts, gross-profit scenarios, and a grounded LangGraph agent."
readme = "README.md"
requires-python = ">=3.10"
authors = [{ name = "Sina Haghgoo" }]
license = { text = "MIT" }
dependencies = [
    "pandas>=2.1",
    "numpy>=1.26",
    "scikit-learn>=1.3",
    "statsmodels>=0.14",
    "lightgbm>=4.0",
    "matplotlib>=3.7",
    "pydantic>=2.5",
    "langchain>=1.0",
    "langchain-core>=1.0",
    "langgraph>=1.0",
    "langchain-openai>=1.0",
    "langchain-anthropic>=1.0",
    "python-dotenv>=1.0",
    "pyyaml>=6.0",
    "pyarrow>=14.0",
    "typing-extensions>=4.9",
]

[project.optional-dependencies]
dev = ["pytest>=8", "ruff>=0.5"]
kaggle = ["kaggle>=1.6"]

[project.scripts]
fincopilot = "fin_copilot.cli:main"

[tool.setuptools.packages.find]
include = ["fin_copilot*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"
filterwarnings = ["ignore::DeprecationWarning"]

[tool.ruff]
line-length = 100
target-version = "py310"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "W"]
ignore = ["E501"]
